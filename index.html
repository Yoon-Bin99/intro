<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Yoon's Intro</title>
</head>
<body>
    <header>
        <h1>Yoon's My Room</h1>
        <p>어서오세요. 윤빈의 마이룸입니다</p>

        <nav>
            <a href="#about">소개</a>
            <a href="#skill">기술</a>
            <a href="#contact">연락처</a>
        </nav>
    </header>

    <hr>

    <main>
        <section id="about">
            <h2>😎 자기소개</h2>
            <img src="profile.png"
                 alt="프로필 사진"
                 width="200">
            <p>백엔드 개발자가 되기 위해 공부하고 있습니다.</p>
        </section>

        <hr>

        <section>
            <h2>💻 기술 스택</h2>

            <ul>
                <li>JAVA</li>
                <li>Spring</li>
                <li>HTML</li>
            </ul>
        </section>

        <hr>

        <section>
            <h2>🎯 취미</h2>

            <ol>
                <li>축구</li>
                <li>야구</li>
                <li>게임</li>
            </ol>
        </section>

        <section>
            <h2>📚 좋아하는 사이트</h2>

            <a href="https://github.com/Yoon-Bin99"
               target="blank">
                Yoon's profile
            </a>
        </section>

        <hr>

        <article>
            <h2>📢 오늘의 한마디</h2>

            <p>
                "꾸준히 공부하면 반드시 성장합니다"
            </p>
        </article>

        <hr>

        <section id="contact">
            <h2>📨 방명록</h2>

            <form>
                <div>
                    <label for="name">이름</label><br>
                    <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="이름을 입력하세요">
                </div>

                <br>

                <div>
                    <label for="message">내용</label><br>

                    <textarea
                            id="message"
                            name="message"
                            rows="5"
                            cols="40"
                            placeholder="메시지를 입력하세요"></textarea>
                </div>

                <br>

                <button type="submit">등록</button>
            </form>

        </section>
    </main>

    <hr>

    <footer>

        <p>
            © 2026 윤빈
        </p>

        <p>
            이메일 :
            <a href="mailto:test@test.com">
                test@test.com
            </a>
        </p>

    </footer>
</body>
</html>
